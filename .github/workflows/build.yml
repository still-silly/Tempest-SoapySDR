name: Build Tempest SoapySDR

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libboost-program-options-dev \
            libboost-thread-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libsoapysdr-dev \
            libuhd-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build SoapySDR plugin
        run: make -C TSDRPlugin_Soapy clean all

      - name: Build native TempestSDR core
        run: make -C TempestSDR clean all

      - name: Test Rust and Slint prototype
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/TempestSDR/bin/LINUX/X64
        run: |
          cargo test --manifest-path rust/Cargo.toml
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Build smoke tests
        run: make -C tools clean all

      - name: Build Java bundle
        run: make -C JavaGUI clean all JAVA_HOME="$JAVA_HOME"

      - name: Verify artifacts
        run: |
          test -f TSDRPlugin_Soapy/bin/LINUX/X64/libTSDRPlugin_Soapy.so
          test -x tools/soapy_plugin_smoke
          test -f JavaGUI/JTempestSDR.jar
          jar tf JavaGUI/JTempestSDR.jar | grep -F 'lib/LINUX/X64/libTSDRPlugin_Soapy.so'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tempest-soapy-linux
          if-no-files-found: error
          path: |
            JavaGUI/JTempestSDR.jar
            TSDRPlugin_Soapy/bin/LINUX/X64/libTSDRPlugin_Soapy.so
            tools/soapy_plugin_smoke

  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0 ndk;28.0.12674087"

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.0.12674087
          RUSTC_WRAPPER: ""
        run: tools/build-android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: tempest-slint-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
