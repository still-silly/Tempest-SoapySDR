name: Manual Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0 ndk;28.0.12674087"

      - name: Build signed release APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.0.12674087
          ANDROID_BUILD_TYPE: Release
          RUSTC_WRAPPER: ""
        run: tools/build-android.sh

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: tempest-slint-android-release
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
